# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "A weighted three-occurrence MAX-HORN-2SAT image class"
  description: >-
    Lean formalization of the dominant-weight optimum identity and the exact
    arithmetic behind an 18/19 approximation for a structured weighted
    three-occurrence MAX-HORN-2SAT image class.
  authors: ["Frank Vega"]
  license: "MIT"
  responsible_maintainers: ["Frank Vega"]

classification:
  arxiv: ["cs.CC", "math.CO"]
  msc2020: ["68Q17", "68W25"]

sources:
  - title: "A PTAS for a weighted three-occurrence MAX-HORN-2SAT image class"
    authors: ["Frank Vega"]
    id: "https://github.com/frankvegadelgado/paloma"
    type: "original-proof"
    location: "https://github.com/frankvegadelgado/paloma/blob/main/doc/paper.tex"
    relationship: "other"
    note: >-
      The paper, Lean development, and independent finite checker are contained
      in this standalone repository.
    license: "MIT"
    author_endorsement: "participated"
  - title: "Tight approximability of MAX 2-SAT and relatives, under UGC"
    authors: ["Joshua Brakensiek", "Neng Huang", "Uri Zwick"]
    id: "https://doi.org/10.1137/1.9781611977912.53"
    type: "informal"
    relationship: "background"
    note: "Source of the general weighted Horn threshold used for comparison."

related_formalizations: []

status:
  scope: >-
    Formalized: the abstract weighted split score; the exact C*M+opt identity
    when one lost consistency clause outweighs all source clauses; the
    division-free 18/19 baseline inequality for C at least 18; and the exact
    rational comparison 18/19 > 0.94615981. The occurrence-cycle syntax and
    PTAS control flow are proved in the paper but are not encoded as a full
    Boolean-language implementation in Lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  main_results:
    - "PalomaMax2SAT.WeightedSplit.dominant_consistency_weight_identity"
    - "PalomaMax2SAT.WeightedSplit.dominant_baseline_18_19"
    - "PalomaMax2SAT.WeightedSplit.ratio_18_19_exceeds_general_weighted_horn"

automation:
  methods:
    - method: "agent"
      models: ["OpenAI GPT-5 Codex"]
      framework: "Codex desktop"
      tool_setup: >-
        AI-assisted Lean authoring with kernel verification delegated to the
        pinned GitHub Actions and Palomar environments.
      cost:
        wall_time: "Not tracked"
        spend_usd: "Not tracked"
        hardware: "Local Windows workstation and API service"
      prompting_notes: >-
        The user requested a focused formalization of the dominant weighted
        split identity and the ratio exceeding 0.94615981.
  spend_usd: "Not tracked"
  notes: "Human-directed, AI-assisted formalization with remote verification."

fidelity:
  divergences: >-
    Lean formalizes the numerical dominance and approximation inequalities.
    The paper supplies the concrete Horn occurrence-cycle construction and
    the algorithmic PTAS case split. The Python checker is independent finite
    evidence and is not imported by Lean.

review:
  status: "self-assessed; not peer reviewed"
  reviewers: ["none"]
  notes: >-
    GitHub Actions builds with the pinned toolchain, applies source-policy
    checks, and runs Comparator with independent kernels.

alignment:
  namespace: "PalomaMax2SAT.WeightedSplit"
  statements:
    - source: "Theorem 2 (Exact weighted identity)"
      lean: "PalomaMax2SAT.WeightedSplit.dominant_consistency_weight_identity"
      module: "Challenge"
      status: "proved"
      note: "Formalizes the dominant-weight C*M+opt identity."
    - source: "Theorem 3 (Explicit improvement)"
      lean: "PalomaMax2SAT.WeightedSplit.dominant_baseline_18_19"
      module: "Challenge"
      status: "proved"
      note: "Formalizes the division-free 18/19 baseline guarantee."
    - source: "Theorem 3 (threshold comparison)"
      lean: "PalomaMax2SAT.WeightedSplit.ratio_18_19_exceeds_general_weighted_horn"
      module: "Challenge"
      status: "proved"
      note: "Checks the decimal comparison by exact rational normalization."

acknowledgements: "Mathlib, Lean, the Lean FRO, ICARM, and the Palomar project."
