version: "v0.4"

project:
  name: "An 83/84 approximation for a cubic three-occurrence Horn class"
  description: >-
    Lean formalization of Frank Vega's cubic-MIS construction, its constructive
    assignment repair, exact 4n+m+alpha optimum identity, and the arithmetic
    transfer of the Berman--Fujito 7/6 guarantee to an 83/84 approximation.
    The cubic class is formalized as port-labelled graphs in which all three
    ports of every vertex are occupied. A second family of results concerns
    hard-consistency occurrence splitting: propagation of hard implications
    around a directed cycle, and two abstract transfer lemmas (optimum
    preservation and feasible-solution value preservation) that take the
    encoding and decoding score equalities as hypotheses, together with the
    exact comparison 83/84 > 0.94615981.
  authors: ["Frank Vega"]
  license: "MIT"
  responsible_maintainers: ["Frank Vega"]

classification:
  arxiv: ["cs.CC", "math.CO"]
  msc2020: ["05C69", "68Q17", "68W25"]

sources:
  - title: "An exact cubic-MIS correspondence and an 83/84 approximation"
    authors: ["Frank Vega"]
    id: "https://github.com/frankvegadelgado/paloma"
    type: "original-proof"
    location: "https://github.com/frankvegadelgado/paloma/blob/main/doc/paper.tex"
    relationship: "other"
    license: "MIT"
    author_endorsement: "participated"
  - title: "On approximation properties of the independent set problem for low degree graphs"
    authors: ["Piotr Berman", "Toshihiro Fujito"]
    id: "https://doi.org/10.1007/s002240000113"
    type: "informal"
    relationship: "background"
    note: "Source of the 7/6 cubic-MIS approximation guarantee."
  - title: "Tight Approximability of MAX 2-SAT and Relatives, under UGC"
    authors: ["Joshua Brakensiek", "Neng Huang", "Uri Zwick"]
    id: "https://doi.org/10.1137/1.9781611977912.53"
    type: "informal"
    relationship: "background"
    note: "Source of the 0.94615981 approximation threshold for weighted MAX {1,2}-HORN-SAT, which is tight under the Unique Games Conjecture; compared against 83/84 in ratio_83_84_exceeds_general_horn_threshold. The Lean development does not formalize their result."

related_formalizations: []

status:
  scope: >-
    Formalized: a finite port-labelled cubic graph interface; the four-clone
    Horn score; transition, false-edge, and deletion sets; independence and
    cardinality of the constructive repair, for port graphs in which every
    port of every vertex is occupied; the matching assignment from an
    independent set; the exact 4n+m+alpha optimum identity; and the exact
    division-free implication from cubic identities and a 7/6 MIS solution to
    the 83/84 Horn guarantee. Also formalized: consistency forced by a strongly
    connected directed cycle of hard Horn implications; an abstract lemma
    that an encoding/decoding pair preserving scores on feasible assignments
    preserves the optimum; the corresponding abstract lemma for the objective
    value of every feasible assignment; and the exact inequality
    83/84 > 0.94615981. The two abstract lemmas are stated for arbitrary
    assignment types, score functions and feasibility predicates; the concrete
    weighted Horn split is not formalized in Lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  main_results:
    - "PalomaMax2SAT.CubicPublic.repairedSet_independent"
    - "PalomaMax2SAT.CubicPublic.repairedSet_card_lower_bound"
    - "PalomaMax2SAT.CubicPublic.exact_three_occurrence_identity"
    - "PalomaMax2SAT.CubicPublic.ratio_83_84_from_cubic_mis"
    - "PalomaMax2SAT.CubicPublic.ratio_83_84_arithmetic"
    - "PalomaMax2SAT.HardSplitPublic.hard_implication_cycle_consistent"
    - "PalomaMax2SAT.HardSplitPublic.exact_hard_occurrence_split"
    - "PalomaMax2SAT.HardSplitPublic.feasible_solution_ratio_preserved"
    - "PalomaMax2SAT.HardSplitPublic.ratio_83_84_exceeds_general_horn_threshold"

automation:
