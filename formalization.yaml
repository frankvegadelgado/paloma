status:
  scope: >-
    Formalized: a finite port-labelled cubic graph interface; the four-clone
    Horn score; transition, false-edge, and deletion sets; independence and
    cardinality of the constructive repair, for port graphs in which every
    port of every vertex is occupied; the matching assignment from an
    independent set; the exact 4n+m+alpha optimum identity; and the exact
    division-free implication from cubic identities and a 7/6 MIS solution to
    the 83/84 Horn guarantee. Also formalized: consistency forced by a strongly
    connected directed cycle of hard Horn implications; abstract transfer
    lemmas for arbitrary assignment types; and a concrete weighted Horn
    occurrence-split model with occurrence-indexed literals, weighted Horn
    clauses, and hard cyclic implications.  For the concrete split, Lean proves
    that encoded source assignments are feasible, that encoding preserves
    score, that decoding any feasible split assignment preserves score, and
    therefore proves concrete optimum preservation and concrete feasible-
    solution value preservation.  The exact inequality
    83/84 > 0.94615981 is also formalized.  The full weighted MAX
    {1,2}-HORN-SAT syntax and the UGC hardness result are not formalized in
    Lean.
