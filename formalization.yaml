fidelity:
  divergences: >-
    The Lean theorem assumes the numerical 7*found >= 6*alpha guarantee rather
    than formalizing the Berman--Fujito algorithm internally. It proves the
    complete cubic reduction, repair, optimum identity, and ratio arithmetic.
    The two hard-split transfer theorems are conditional abstract lemmas: they
    quantify over arbitrary assignment types, scores and feasibility
    predicates and assume the encoding and decoding score equalities as
    hypotheses. Those equalities for the concrete weighted Horn occurrence
    split are not proved in Lean; they are argued in the paper and checked
    experimentally on small instances. The directed-cycle theorem proves the
    consistency mechanism independently. The port-graph interface requires
    every port of every vertex to be used by exactly one edge endpoint; it does
    not exclude parallel edges.

review:
  status: "self-assessed; not peer reviewed"
  reviewers: ["none"]
  notes: >-
    GitHub Actions builds with the pinned toolchain, applies source-policy
    checks, and runs Comparator with independent kernels.

alignment:
  namespace: "PalomaMax2SAT.CubicPublic"
  statements:
    - source: "Lemma 2 (Quantitative repair)"
      lean: "PalomaMax2SAT.CubicPublic.repairedSet_card_lower_bound"
      module: "Challenge"
      status: "proved"
    - source: "Theorem 3 (Exact identity)"
      lean: "PalomaMax2SAT.CubicPublic.exact_three_occurrence_identity"
      module: "Challenge"
      status: "proved"
    - source: "Theorem 4 (Cubic Horn approximation)"
      lean: "PalomaMax2SAT.CubicPublic.ratio_83_84_from_cubic_mis"
      module: "Challenge"
      status: "proved"
    - source: "Hard-consistency weighted occurrence split"
      lean: "PalomaMax2SAT.HardSplitPublic.exact_hard_occurrence_split"
      module: "Challenge"
      status: "proved"
      note: "Abstract conditional lemma: given encode/decode score equalities on feasible assignments, the feasible optimum equals the source optimum. The equalities for the concrete split are hypotheses."
    - source: "Feasible-solution approximation transfer"
      lean: "PalomaMax2SAT.HardSplitPublic.feasible_solution_ratio_preserved"
      module: "Challenge"
      status: "proved"
      note: "Abstract conditional lemma: given the decode score equality, each feasible solution has the objective value of its decoded source assignment."

