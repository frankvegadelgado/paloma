version: "v0.4"

project:
  name: "An 83/84 approximation for a cubic three-occurrence Horn class"
  description: >-
    Lean formalization of Frank Vega's cubic-MIS construction, its constructive
    assignment repair, the exact 4n+m+alpha optimum identity, and the
    arithmetic transfer of the Berman--Fujito 7/6 guarantee to an 83/84
    approximation. The cubic class is formalized as port-labelled graphs in
    which all three ports of every vertex are occupied. The formula T_H is
    formalized explicitly as a list of Horn clauses (module SemanticHorn): the
    number of satisfied clauses equals the score, the maximum over assignments
    is exactly 4n+m+alpha, every clause has at most one negative literal, and
    there are 5n+m clauses, and every variable occurs exactly three times. A second result family
    (module GraphTransfer) formalizes the hard-score graph transfers: the exact
    hard optima 4m+alpha for edge weight four and m+alpha for unit weights,
    the 257/260 and 77/80 transfers from a 17/20 independent set, and the
    conditional 27/28 bound. The 27/28 theorems are conditional: they take as
    hypotheses a Berman--Fujito guarantee 5999993*alpha <= 7000000*s when
    20000*alpha <= 9999*n, and a near-bipartite cut guarantee 37*n <= 80*s
    when 20000*alpha > 9999*n, and prove only that these imply
    28*(m+s) >= 27*(m+alpha); Lean does not prove that an algorithm attains
    either guarantee.
  authors: ["Frank Vega"]
  license: "MIT"
  responsible_maintainers: ["Frank Vega"]

