project: PalomaMax2SAT
paper: paper.tex
lean_toolchain_file: lean-toolchain

main_result:
  name: ugc_barrier
  paper_theorem: thm:ugc-class
  statement: On the class {T_H(G)} of three-occurrence Horn formulas from MAX-CUT instances the polynomial-time factor 83/84 exceeds the Unique Games thresholds 0.94616 (Brakensiek-Huang-Zwick) and 0.94017 (Lewin-Livnat-Zwick) that hold for all instances.
  lean_modules: [PalomaMax2SAT.CutLift, PalomaMax2SAT.CutTransfer, PalomaMax2SAT.CitedResults]
  cited_not_formalized: [Goemans-Williamson/Mahajan-Ramesh cut guarantee, Unique Games thresholds]

modules:
  - name: PalomaMax2SAT.CubicThreeOccurrence
    path: PalomaMax2SAT/CubicThreeOccurrence.lean
    status: formalized
    notes: Cubic 3-port construction, repair, optimum 4n + m + α, and 83/84 transfer arithmetic.

  - name: PalomaMax2SAT.SemanticHorn
    path: PalomaMax2SAT/SemanticHorn.lean
    status: formalized
    notes: Explicit Horn clauses, score decomposition, 5n + m clause count, and 3 occurrences per variable.

  - name: PalomaMax2SAT.DegreeTransfer
    path: PalomaMax2SAT/DegreeTransfer.lean
    status: formalized_arithmetic
    notes: Degree-d ratio inequalities, d = 21 two-branch arithmetic, and ρ(d) / (21d + 20)/(21d + 21) bounds.

  - name: PalomaMax2SAT.DegreeFormula
    path: PalomaMax2SAT/DegreeFormula.lean
    status: formalized
    notes: Uniform degree-d T_H formula, (d + 1)n + m + α optimum, and lifts of independent sets.

  - name: PalomaMax2SAT.GeneralDegreeFormula
    path: PalomaMax2SAT/GeneralDegreeFormula.lean
    status: formalized
    notes: Non-regular degrees d_v, (d_v + 1)-cycles; repair, exact identity OPT = B + alpha (B = n + 3m when degrees sum to 2m), and the 0.9932 ratio step.

  - name: PalomaMax2SAT.HardOccurrenceSplit
    path: PalomaMax2SAT/HardOccurrenceSplit.lean
    status: formalized
    notes: Hard-cycle consistency lemma for occurrence split P(F).

  - name: PalomaMax2SAT.GraphTransfer
    path: PalomaMax2SAT/GraphTransfer.lean
    status: formalized_with_hypotheses
    notes: Hard optima 4m + α and m + α, 257/260 and 77/80 transfers, and 27/28 branch arithmetic from numerical hypotheses.

  - name: PalomaMax2SAT.CutTransfer
    path: PalomaMax2SAT/CutTransfer.lean
    status: formalized
    notes: MAX-CUT clause count m + cut(S) and Corollary cor:cutratio arithmetic and the strict inequality rho_d(gamma) > 0.8785 of Remark rem:gamma-linear (lifted_ratio_gt_gw).

  - name: PalomaMax2SAT.PaperArithmetic
    path: PalomaMax2SAT/PaperArithmetic.lean
    status: formalized
    notes: Numerical statements of the paper: 83/84 above the UG thresholds (thm:ugc-class), two-branch arithmetic of thm:ratio, constants of thm:cutclass, thm:nonreg-cutclass and prop:bounded-cut, the supremum of rem:gamma-linear, the cube example, and the value tables.

  - name: PalomaMax2SAT.CutLift
    path: PalomaMax2SAT/CutLift.lean
    status: formalized
    notes: Lifting step for Theorem thm:cutclass from independent sets with 18785 α(H) ≤ 20000 |I|.

  - name: PalomaMax2SAT.CitedResults
    path: PalomaMax2SAT/CitedResults.lean
    status: axiomatized_as_hypotheses
    notes: Explicit hypotheses for Goemans-Williamson/Mahajan-Ramesh cut bound and Berman-Fujito independent set bound.

  - name: PalomaMax2SAT.OnesOptimal
    path: PalomaMax2SAT/OnesOptimal.lean
    status: formalized
    notes: Max-Ones for negative (Horn) 2-CNF equals the independence number, Min-Ones for positive 2-CNF equals |F| plus the minimum vertex cover outside F, and Gallai's identity.

  - name: PalomaMax2SAT.LReduction
    path: PalomaMax2SAT/LReduction.lean
    status: formalized
    notes: Greedy independent set of size at least n/(Delta+1), first L-reduction constant 2 OPT <= ((3d+2)(d+1)+2) alpha (23 for d = 3), and second constant 1.

  - name: PalomaMax2SAT.ConflictGraph
    path: PalomaMax2SAT/ConflictGraph.lean
    status: formalized
    notes: Conflict graph of F_G on literal occurrences and the identity alpha(H(G)) = m + maxcut(G) (Proposition prop:cutconflict).

  - name: PalomaMax2SAT.ConflictDegree
    path: PalomaMax2SAT/ConflictDegree.lean
    status: formalized
    notes: Degrees of the conflict graph, (d+1)-regularity, 2 deg(v) occurrences of x_v, and M >= 4m for arbitrary graphs.

  - name: PalomaMax2SAT.OnesBridge
    path: PalomaMax2SAT/OnesBridge.lean
    status: formalized
    notes: For the cubic port graph, OPT(T_H) = 4n + m + alpha and MaxOnes(N_H) = alpha with the same alpha; MinOnes of the positive formula is n - alpha.

  - name: PalomaMax2SAT.SignedGraph
    path: PalomaMax2SAT/SignedGraph.lean
    status: formalized
    notes: Theorem thm:signed. Independent sets of the signed graph J have weight at most D M + OPT(F), decode to assignments, and the bound is attained.

unformalized_in_lean:
  - Semidefinite programming rounding and derandomization (Goemans-Williamson, Mahajan-Ramesh, Trevisan)
  - Berman-Fujito approximation algorithm proofs
  - APX-completeness of cubic Maximum Independent Set (Alimonti-Kann), used to conclude APX-completeness of the image class
  - Hardness of Maximum Independent Set and Minimum Vertex Cover (Hastad, Zuckerman, Khot-Regev, Austrin-Khot-Safra, Chan, Halperin) used for Max-Ones and Min-Ones
  - Unique Games Conjecture hardness thresholds (Brakensiek-Huang-Zwick, Lewin-Livnat-Zwick, Ghoshal et al., Khot-Kindler-Mossel-O'Donnell for MAX-CUT)
  - Analytic part of Proposition prop:gamma-ratio (convex envelope of arccos(1-2x)/pi and the maximum 0.10526 of gamma - h(gamma))
  - Vertex count 3D and maximum degree three of the signed graph J (Theorem thm:signed)
  - Polynomial running time of every constructive statement (the repair, the lifts and the decodings are defined as functions, their running time is not modelled)
