related_formalizations: []

status:
  scope: >-
    Main formalized content (cubic construction): a finite port-labelled cubic
    graph interface; the four-clone Horn score; transition, false-edge, and
    deletion sets; independence and cardinality of the constructive repair for
    port graphs in which every port of every vertex is occupied; the matching
    assignment from an independent set; the exact 4n+m+alpha optimum identity;
    and the exact division-free implication from cubic identities and a 7/6
    MIS solution to the 83/84 Horn guarantee. The hard-score graph transfers
    formalize the exact hard optima 4m+alpha and m+alpha and the 257/260 and
    77/80 lifts of a 17/20 independent set. The theorem
    unit_endpoint_arithmetic is conditional: it proves the 27/28 arithmetic
    from a numerical hypothesis on the independent-set size and does not prove
    that an algorithm attains it. The Berman--Fujito guarantee, the Trevisan
    near-bipartite branch, the L-reduction and APX-completeness argument, the
    general weighted theorems and the UGC discussion are proved in the
    manuscript and are not formalized in Lean. The UGC comparisons of 83/84 with the
    constants 0.94615981 and 0.94016567 are in the manuscript and are not part
    of the selected Lean statements. The full weighted MAX {1,2}-HORN-SAT syntax and the UGC
    hardness result are not formalized in Lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  main_results:
    - "PalomaMax2SAT.CubicPublic.repairedSet_independent"
    - "PalomaMax2SAT.CubicPublic.repairedSet_card_lower_bound"
    - "PalomaMax2SAT.CubicPublic.exact_three_occurrence_identity"
