version: v0.4
project:
  name: "PalomaMax2SAT: an 83/84 approximation for a cubic three-occurrence Horn class"
  description: "Lean 4 formalization of the paper 'An 83/84 approximation for a cubic three-occurrence Horn class'. The compared results are: the three-occurrence formula T_H built from a cubic graph, its explicit clause semantics (at most one negative literal per clause, with a proved complement-variable translation to standard Horn clauses that preserves satisfaction), the exact identity OPT(T_H) = 4n + m + alpha, the repair lemma, the number of clauses and the three occurrences of every variable, and the 83/84 approximation ratio transferred from a cubic independent-set guarantee, together with the degree-d ratio arithmetic. The supporting modules also formalize the MAX-CUT reduction, the conflict graph and the lift of a Goemans-Williamson cut to the 83/84 ratio. Goemans-Williamson, Berman-Fujito and the Unique Games thresholds are cited hypotheses, not reproved."
  authors:
    - name: "Frank Vega"
      orcid: "0000-0001-8210-4126"
      email: "vega.frank@gmail.com"
      affiliation: "Information Physics Institute"
  license: "Apache-2.0"
  responsible_maintainers:
    - name: "Frank Vega"
      github: "frankvegadelgado"
      email: "vega.frank@gmail.com"

classification:
  arxiv: ["cs.CC", "cs.DS"]
  msc: ["68Q25", "68W25", "90C27"]

paper: paper.tex
lean_toolchain_file: lean-toolchain

sources:
  - title: "An 83/84 approximation for a cubic three-occurrence Horn class"
    type: manuscript
    relationship: formalizes
    authors: ["Frank Vega"]
  - title: "Improved approximation algorithms for maximum cut and satisfiability problems using semidefinite programming"
    relationship: background
    authors: ["Michel X. Goemans", "David P. Williamson"]
  - title: "Approximating vertex cover / independent set in bounded-degree graphs (Berman-Fujito)"
    relationship: background
    authors: ["Piotr Berman", "Toshihide Fujito"]

automation:
  methods:
    - method: manual
      notes: "The author states the theorems, writes and edits the paper (with the AI assistance described below), and reviews the formal statements in Challenge.lean."
    - method: other
      notes: "Claude (Anthropic) assisted in deriving the proofs, in writing the Lean 4 formalization and in preparing the manuscript; the author reviewed and edited the AI-assisted content. The Lean proofs are checked by the Lean kernel via lake build, and lake comparator verifies Solution.lean against Challenge.lean in GitHub Actions. The fuller account is in the Acknowledgments of the pinned manuscript (doc/paper.tex)."

review:
  status: "self-assessed"
  notes: "Checked by the author alone, not independently reviewed. The author reviewed the formal statements in Challenge.lean, the manuscript and the AI-assisted content, as the manuscript states. The mechanical basis is the Lean kernel check (lake build) and the Comparator run of Solution.lean against Challenge.lean in GitHub Actions."

repository:
  role: substantive-development

related_formalizations: []

main_result:
  name: ugc_bounded
  paper_theorem: thm:ugc-class
  statement: On the class {T_H(G)} of three-occurrence Horn formulas from MAX-CUT instances the polynomial-time factor 83/84 exceeds the Unique Games thresholds 0.94616 (Brakensiek-Huang-Zwick) and 0.94017 (Lewin-Livnat-Zwick) that hold for all instances.
  lean_modules: [PalomaMax2SAT.UgcBounded, PalomaMax2SAT.BoundedLemmas, PalomaMax2SAT.GeneralDegreeFormula, PalomaMax2SAT.UgcClass, PalomaMax2SAT.CutLift, PalomaMax2SAT.CutTransfer, PalomaMax2SAT.ConflictGraph, PalomaMax2SAT.ConflictDegree, PalomaMax2SAT.CitedResults]
  cited_not_formalized: [Goemans-Williamson/Mahajan-Ramesh cut guarantee, Unique Games thresholds]

modules:
  - name: PalomaMax2SAT.CubicThreeOccurrence
    path: PalomaMax2SAT/CubicThreeOccurrence.lean
    status: formalized
    notes: Cubic 3-port construction, repair, optimum 4n + m + α, and 83/84 transfer arithmetic.

  - name: PalomaMax2SAT.SemanticHorn
    path: PalomaMax2SAT/SemanticHorn.lean
    status: formalized
    notes: "Explicit clauses with at most one negative literal, the complement-variable translation to standard Horn clauses (at most one positive literal) preserving satisfaction, score decomposition, 5n + m clause count, and 3 occurrences per variable."

  - name: PalomaMax2SAT.DegreeTransfer
    path: PalomaMax2SAT/DegreeTransfer.lean
    status: formalized_arithmetic
    notes: Degree-d ratio inequalities, d = 21 two-branch arithmetic, and ρ(d) / (21d + 20)/(21d + 21) bounds.

  - name: PalomaMax2SAT.DegreeFormula
    path: PalomaMax2SAT/DegreeFormula.lean
    status: formalized
    notes: "Uniform degree-d T_H formula, complement-variable translation to standard Horn clauses, (d + 1)n + m + α optimum, and lifts of independent sets."

  - name: PalomaMax2SAT.CutTransfer
    path: PalomaMax2SAT/CutTransfer.lean
    status: formalized
    notes: MAX-CUT clause count m + cut(S) and Corollary cor:cutratio arithmetic.

  - name: PalomaMax2SAT.PaperArithmetic
    path: PalomaMax2SAT/PaperArithmetic.lean
    status: formalized
    notes: "Numerical statements of the paper: 83/84 above the UG thresholds (thm:ugc-class), two-branch arithmetic of thm:ratio, constants of thm:cutclass and prop:bounded-cut, and the value tables."

  - name: PalomaMax2SAT.CutLift
    path: PalomaMax2SAT/CutLift.lean
    status: formalized
    notes: Lifting step for Theorem thm:cutclass from independent sets with 18785 α(H) ≤ 20000 |I|.

  - name: PalomaMax2SAT.UgcBroken
    path: PalomaMax2SAT/UgcBroken.lean
    status: formalized
    notes: "Theorem ugc_broken (thm:ugc-broken, item 3 and the threshold comparison): beta* < alpha* < 19/20 < 83/84, (3d+2)/(3d+3) > 19/20 for d >= 6, and for every degree D >= 3 an independent set with 6 alpha <= 7 |I| lifts to the ratio 83/84 on T_H. The GHLMM guarantee (items 1 and 2) and the Unique Games thresholds are cited, not formalized."

  - name: PalomaMax2SAT.UgcClass
    path: PalomaMax2SAT/UgcClass.lean
    status: formalized
    notes: "Theorem ugc_class (thm:ugc-class): beta* < alpha* < 83/84; selSet is an independent set of size m + cut(S) of the conflict graph; alpha(H(G)) = m + maxcut(G); H(G) is (d+1)-regular with 4m vertices; 8785 c <= 10000 cut implies 18785 (m+c) <= 20000 (m+cut); and the 83/84 lift of an independent set with 18785 alpha <= 20000 |I| on T_H for every D > 0. The Goemans-Williamson guarantee and the Unique Games thresholds are cited, not formalized."

  - name: PalomaMax2SAT.GeneralDegreeFormula
    path: PalomaMax2SAT/GeneralDegreeFormula.lean
    status: formalized
    notes: "T_H for a port-labelled graph with a degree d_v at every vertex: sum d_v = 2m, sum (d_v+1) + m = n + 3m, satisfied clauses = U + (m - F) + (sum (d_v+1) - T), cycle lemma and repair, OPT = sum (d_v+1) + m + alpha, and the value sum (d_v+1) + m + |I| of the lift of an independent set. The Horn property and the three-occurrence count are formalized only for regular graphs (DegreeFormula)."

  - name: PalomaMax2SAT.BoundedLemmas
    path: PalomaMax2SAT/BoundedLemmas.lean
    status: formalized
    notes: "Counting lemmas for H(G): degree sums, 4m <= M, maximum degree d+1, and the division-free ratio arithmetic used by ugc_bounded."

  - name: PalomaMax2SAT.RegularLemmas
    path: PalomaMax2SAT/RegularLemmas.lean
    status: formalized
    notes: "Degrees 1 and 2 of T_H: the independence number of a 1-regular port graph is m, the optimum is 3n for d = 1 and 4n + alpha for d = 2 (m = n). The exact computation of a maximum independent set on paths and cycles is not formalized."

  - name: PalomaMax2SAT.UgcRegular
    path: PalomaMax2SAT/UgcRegular.lean
    status: formalized
    notes: "Theorem all_degd (thm:all-degd): for every d >= 1 the optimum (d+1)n+m+alpha, 2m = dn, 2 alpha <= n, the repair, the lift (d+1)n+m+|I|, the all-true ratio (3d+2)/(3d+3) and 83/84 for d >= 27, the 6/7 transfer (21d+20)/(21d+21), the threshold, Berman-Fujito (d >= 22 and the epsilon = 1/c form) and d = 21 transfers as hypotheses, and the exact optima for d = 1 and d = 2. The polynomial running times and the cited guarantees are not formalized."

  - name: PalomaMax2SAT.UgcBounded
    path: PalomaMax2SAT/UgcBounded.lean
    status: formalized
    notes: "Theorem ugc_bounded (thm:ugc-class, bounded degree): beta* < alpha* < 83/84 < 0.9932; selSet is independent of size m + cut(S); alpha(H(G)) = m + maxcut(G); H(G) has maximum degree at most d+1 when G has maximum degree at most d; the degrees of H(G) add up to 4m + 2 sum deg^2; 4m <= M, alpha <= 2m and 18785 alpha <= 20000 s give 9932 (B+alpha) <= 10000 (B+s); and the identities and the 9932/10000 lift of T_H for every port-labelled graph. The identification of T_H(G) with a port-labelled graph, the Goemans-Williamson guarantee and the Unique Games thresholds are not formalized."

  - name: PalomaMax2SAT.CitedResults
    path: PalomaMax2SAT/CitedResults.lean
    status: axiomatized_as_hypotheses
    notes: Explicit hypotheses for Goemans-Williamson/Mahajan-Ramesh cut bound and Berman-Fujito independent set bound.

  - name: PalomaMax2SAT.LReduction
    path: PalomaMax2SAT/LReduction.lean
    status: formalized
    notes: Greedy independent set of size at least n/(Delta+1), first L-reduction constant 2 OPT <= ((3d+2)(d+1)+2) alpha (23 for d = 3), and second constant 1.

  - name: PalomaMax2SAT.ConflictGraph
    path: PalomaMax2SAT/ConflictGraph.lean
    status: formalized
    notes: Conflict graph of F_G on literal occurrences and the identity alpha(H(G)) = m + maxcut(G) (Proposition prop:cutconflict).

  - name: PalomaMax2SAT.ConflictDegree
    path: PalomaMax2SAT/ConflictDegree.lean
    status: formalized
    notes: Degrees of the conflict graph, (d+1)-regularity, 2 deg(v) occurrences of x_v, and 4m vertices of the conflict graph.

unformalized_in_lean:
  - Semidefinite programming rounding and derandomization (Goemans-Williamson, Mahajan-Ramesh, Trevisan)
  - Berman-Fujito approximation algorithm proofs
  - APX-completeness of cubic Maximum Independent Set (Alimonti-Kann), used to conclude APX-completeness of the image class
  - Unique Games Conjecture hardness thresholds (Brakensiek-Huang-Zwick, Lewin-Livnat-Zwick, Ghoshal et al., Khot-Kindler-Mossel-O'Donnell for MAX-CUT)
  - "OPT(T_H) = B + m + maxcut(G) for the conflict graph as a single statement (Proposition prop:cutconflict); its ingredients are proved separately"
  - "Simplicity of the conflict graph H(G) as a separate lemma (Proposition prop:cutconflict); OPT(F_G) = m + maxcut(G) as one statement and Corollary cor:cutratio with real gamma and rho (proved division-free)"
  - "Decimal remarks of the Unique Games section (19/20 above 0.94615981, 0.04793, 0.022)"
  - "Trevisan bound 1 - 4 sqrt(eps) + 8 eps > 0.95, the Goemans-Williamson bound arccos(1-2c)/pi for c >= 0.845 and the exhaustive solution of small orders (Theorem thm:ratio, Proposition prop:degd (5))"
  - Polynomial running time of every constructive statement (the repair, the lifts and the decodings are defined as functions, their running time is not modelled)
