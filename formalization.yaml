fidelity:
  divergences: >-
    The Lean theorem assuming the numerical 7*found >= 6*alpha guarantee is
    used instead of formalizing the Berman--Fujito algorithm internally.  It
    proves the complete cubic reduction, repair, optimum identity, and ratio
    arithmetic.  The hard-split family includes both abstract transfer lemmas
    and a concrete weighted Horn occurrence-split model.  The concrete model
    represents weighted Horn clauses over occurrence-indexed literals and
    represents hard cyclic implications through the feasibility predicate; it
    proves the encode/decode score equalities and derives concrete optimum
    preservation and concrete feasible-solution value preservation.  It does
    not formalize the paper's full weighted MAX {1,2}-HORN-SAT parser or the
    experimental checker, and it does not formalize the UGC hardness result.
    The port-graph interface requires every port of every vertex to be used by
    exactly one edge endpoint; it does not exclude parallel edges.

