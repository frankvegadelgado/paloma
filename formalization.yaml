version: "v0.4"

project:
  name: "An 83/84 approximation for a cubic three-occurrence Horn class"
  description: >-
    Lean formalization of Frank Vega's cubic-MIS construction, its constructive
    assignment repair, the exact 4n+m+alpha optimum identity, and the
    arithmetic transfer of the Berman--Fujito 7/6 guarantee to an 83/84
    approximation. The cubic class is formalized as port-labelled graphs in
    which all three ports of every vertex are occupied.  A supporting family of
    formalized results covers the standard hard-consistency occurrence split:
    propagation of hard implications around a directed cycle, abstract
    transfer lemmas, and a concrete weighted Horn occurrence-split model.
    These results formalize a routine forced-equality gadget for verification
    and reuse; they are not claimed as an independent research contribution.
    The exact comparison 83/84 > 0.94615981 is also formalized.  The main
    mathematical content is the cubic repair, the exact optimum identity, and
    the arithmetic transfer to 83/84.
  authors: ["Frank Vega"]
  license: "MIT"
  responsible_maintainers: ["Frank Vega"]

