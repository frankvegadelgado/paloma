version: "v0.4"

project:
  name: "An 83/84 approximation for a cubic three-occurrence Horn class"
  description: >-
    Lean formalization of Frank Vega's cubic-MIS construction, its constructive
    assignment repair, exact 4n+m+alpha optimum identity, and the arithmetic
    transfer of the Berman--Fujito 7/6 guarantee to an 83/84 approximation.
    The cubic class is formalized as port-labelled graphs in which all three
    ports of every vertex are occupied. A second family of results concerns
    hard-consistency occurrence splitting: propagation of hard implications
    around a directed cycle, abstract transfer lemmas, and a concrete weighted
    Horn occurrence-split model.  For the concrete split, the Lean development
    proves that encoded source assignments are feasible, that encoding preserves
    score, that decoding every feasible split assignment preserves score, and
    consequently proves exact optimum preservation and feasible-solution value
    preservation without assuming the encode/decode score equalities.  The
    exact comparison 83/84 > 0.94615981 is also formalized.
  authors: ["Frank Vega"]
  license: "MIT"
  responsible_maintainers: ["Frank Vega"]

