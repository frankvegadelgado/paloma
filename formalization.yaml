  notes: "Human-directed, AI-assisted formalization with remote verification."

fidelity:
  divergences: >-
    The Lean theorem assuming the numerical 7*found >= 6*alpha guarantee is
    used instead of formalizing the Berman--Fujito algorithm internally. It
    proves the complete cubic reduction, repair, optimum identity, and ratio
    arithmetic. The graph-transfer theorems take the independent-set
    guarantee as a hypothesis, and unit_endpoint_arithmetic additionally
    takes the near-bipartite branch guarantee as a hypothesis. It does not
    formalize the paper's full weighted MAX {1,2}-HORN-SAT parser or the
    experimental checker, and it does not formalize the UGC hardness result.
    The port-graph interface requires every port of every vertex to be used by
    exactly one edge endpoint; it does not exclude parallel edges.

review:
  status: "self-assessed; not peer reviewed"
  reviewers: ["none"]
  notes: >-
    GitHub Actions builds with the pinned toolchain, applies source-policy
    checks, and runs Comparator with independent kernels. The comparison of the
    selected declarations, including the graph-transfer results, completed
    successfully with kernel checking. No verification step is pending.

