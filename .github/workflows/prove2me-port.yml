name: Prove2Me port (Lean v4.33.1)

on:
  workflow_dispatch:
  push:
    branches: [prove2me-v4.33.1]

permissions:
  contents: write

jobs:
  port-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install toolchain from lean-toolchain
        run: elan toolchain install "$(cat lean-toolchain)"
      - name: Update Mathlib to the pinned rev
        run: lake update mathlib
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Build
        run: lake build 2>&1 | tee build.log
      - name: Axiom check
        run: lake env lean scripts/AxiomCheck.lean 2>&1 | tee axioms.log
      - name: Extract declaration graph (Stage 1)
        continue-on-error: true
        run: |
          mkdir -p extract
          lake env lean scripts/extract_decl_graph.lean 2>&1 | tee extract/stage1.log
          mv decl_graph.jsonl extract/ || true
      - name: Extract sketch facts (Stage 2)
        continue-on-error: true
        run: |
          mkdir -p extract
          for f in PalomaMax2SAT/*.lean Solution.lean; do
            b=$(basename "$f" .lean)
            lake env lean --run scripts/extract_sketch_info.lean "$f" PalomaMax2SAT > "extract/sketch_info.$b.jsonl" 2> "extract/sketch_info.$b.err" || echo "failed: $f" >> extract/stage2.failed
          done
      - name: Commit updated lake-manifest.json to the branch
        if: github.ref == 'refs/heads/prove2me-v4.33.1'
        run: |
          if ! git diff --quiet -- lake-manifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lake-manifest.json
            git commit -m "Update lake-manifest.json for Lean v4.33.1 [skip ci]"
            git push
          fi
      - name: Upload manifest and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: port-results
          path: |
            lake-manifest.json
            build.log
            axioms.log
            extract/
